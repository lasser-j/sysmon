name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.preset }}, ${{ matrix.compiler }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [dev, tsan]
        compiler: [gcc-13, clang-18]
        include:
          - compiler: gcc-13
            cc: gcc-13
            cxx: g++-13
          - compiler: clang-18
            cc: clang-18
            cxx: clang++-18
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel
      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  benchmarks:
    name: benchmarks (build + smoke run)
    runs-on: ubuntu-24.04
    env:
      CC: gcc-13
      CXX: g++-13
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset release
      - name: Build
        run: cmake --build --preset release --parallel
      # Timings on shared runners are too noisy to detect regressions, so this only checks that the benchmarks run
      - name: Smoke run
        run: ./build-release/libs/concurrent/benchmarks/concurrent_benchmarks --benchmark_min_time=0.01s
